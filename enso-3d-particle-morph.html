        const y2 = target[1];
        const z2 = (Math.random() - 0.5) * 40;

        particles.push({
          x1: x1, y1: y1, z1: z1,
          x2: x2, y2: y2, z2: z2,
          radius: 0.7 + Math.random() * 1.3,
          phase: Math.random() * Math.PI * 2
        });
      }

      let time = 0;
      let morphProgress = 0;
      let targetMorph = 1;

      canvas.addEventListener('click', () => {
        targetMorph = targetMorph === 0 ? 1 : 0;
      });

      // Toggle morph every 5 seconds automatically
      setInterval(() => {
        targetMorph = targetMorph === 0 ? 1 : 0;
      }, 5000);

      function render() {
        time += 0.02;

        morphProgress += (targetMorph - morphProgress) * 0.04;

        modeBadge.textContent = morphProgress > 0.5 ? 'MODE: ARTWORK FORMATION (筆跡収束)' : 'MODE: COSMIC DUST (宇宙散開)';

        ctx.clearRect(0, 0, width, height);

        const cx = width / 2;
        const cy = height / 2;

        const rotY = Math.sin(time * 0.3) * 0.2;
        const rotX = Math.cos(time * 0.2) * 0.1;

        const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

        const drawList = [];

        const t = morphProgress;
        const easeT = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        particles.forEach(p => {
          const noiseX = Math.sin(p.phase + time * 1.8) * 16 * (1 - easeT);
          const noiseY = Math.cos(p.phase + time * 1.5) * 16 * (1 - easeT);
          const noiseZ = Math.sin(p.phase * 2 + time) * 16 * (1 - easeT);

          const curX = p.x1 + (p.x2 - p.x1) * easeT + noiseX;
          const curY = p.y1 + (p.y2 - p.y1) * easeT + noiseY;
          const curZ = p.z1 + (p.z2 - p.z1) * easeT + noiseZ;

          const xRotY = curX * cosY - curZ * sinY;
          const zRotY = curX * sinY + curZ * cosY;

          const yRotX = curY * cosX - zRotY * sinX;
          const zRotX = curY * sinX + zRotY * cosX;

          const fov = 400;
          const scale = fov / (fov + zRotX + 350);

          drawList.push({
            x: cx + xRotY * scale,
            y: cy + yRotX * scale,
            z: zRotX,
            r: p.radius * scale,
            alpha: Math.min(1.0, Math.max(0.2, scale * 0.9))
          });
        });

        // Depth sort
        drawList.sort((a, b) => b.z - a.z);

        drawList.forEach(p => {
          ctx.fillStyle = p.z > 30 ? '#E4E3DF' : '#C8C6BE';
          ctx.globalAlpha = p.alpha;
          ctx.beginPath();
          ctx.arc(p.x, p.y, Math.max(0.4, p.r), 0, Math.PI * 2);
          ctx.fill();
        });

        requestAnimationFrame(render);
      }

      render();
    });
  </script>
</body>
</html>
