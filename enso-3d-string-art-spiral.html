<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Native Classic | Fine String Art with Stardust Sparkles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #000000;
    color: #E4E3DF;
    font-family: 'Cinzel', serif, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas-container {
    width: 100vw;
    height: 100vh;
    position: absolute;
    top: 0; left: 0;
    cursor: grab;
  }

  #canvas-container:active {
    cursor: grabbing;
  }

  .ui-panel {
    position: absolute;
    bottom: 45px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    pointer-events: none;
  }

  .ui-title {
    font-size: 14px;
    letter-spacing: 0.4em;
    color: #E4E3DF;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .ui-sub {
    font-size: 11px;
    letter-spacing: 0.22em;
    color: #999990;
    opacity: 0.85;
  }

  .controls-bar {
    position: absolute;
    top: 35px;
    right: 40px;
    z-index: 10;
    display: flex;
    gap: 12px;
  }

  .btn-view {
    background: rgba(15, 15, 15, 0.85);
    border: 1px solid rgba(220, 220, 210, 0.35);
    color: #E4E3DF;
    font-size: 11px;
    letter-spacing: 0.2em;
    padding: 10px 20px;
    border-radius: 30px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: all 0.3s ease;
  }

  .btn-view:hover {
    background: #E4E3DF;
    color: #000000;
  }

  .btn-view.active {
    border-color: #E4E3DF;
    background: rgba(228, 227, 223, 0.25);
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="controls-bar">
    <button class="btn-view active" id="btnFront">【 縦長全景構図 】</button>
    <button class="btn-view" id="btnDiagonal">【 斜め旋回 】</button>
    <button class="btn-view" id="btnTop">【 真上視点 (円相) 】</button>
    <button class="btn-view" id="btnAutoRotate">自動回転: ON</button>
  </div>

  <div class="ui-panel">
    <div class="ui-title">Native Classic — Fine String Art with Stardust</div>
    <div class="ui-sub">【掴んで動かすと星屑が綺麗に舞い散るインタラクティブ演出】</div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let stringArtGroup, nodesGroup;
    let stardustSystem, stardustGeo;
    let autoRotate = true;
    let isUserInteracting = false;
    let isDragging = false;

    let targetCameraPos = new THREE.Vector3(0, 0, 960);
    let targetLookAt = new THREE.Vector3(0, 0, 0);

    const simplex = new SimplexNoise();
    const NUM_STRINGS = 380;
    const HEIGHT = 1250;

    // 星屑パーティクル管理データ
    const MAX_STARDUST = 3500;
    const stardustParticles = [];

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.0005);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 4000);
      camera.position.copy(targetCameraPos);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x000000, 1.0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.4;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 2500;
      controls.minDistance = 50;

      controls.minPolarAngle = 0.0001;
      controls.maxPolarAngle = Math.PI - 0.0001;

      // 掴んで回す（ドラッグ操作）時の星屑エミッター制御
      controls.addEventListener('start', () => {
        isUserInteracting = true;
        isDragging = true;
      });

      controls.addEventListener('end', () => {
        isDragging = false;
      });

      // マウス/タッチドラッグ中に星屑を連続噴出
      controls.addEventListener('change', () => {
        if (isDragging) {
          emitStardustParticles(8); // 回すたびに8個の星屑が生成
        }
      });

      // Studio Ambient Lights
      const ambientLight = new THREE.AmbientLight(0xFFFFFF, 0.65);
      scene.add(ambientLight);

      const topLight = new THREE.DirectionalLight(0xFFFFFF, 2.5);
      topLight.position.set(150, 600, 300);
      scene.add(topLight);

      const bottomLight = new THREE.PointLight(0xFFFFFF, 2.0, 1000);
      bottomLight.position.set(0, -400, 200);
      scene.add(bottomLight);

      stringArtGroup = new THREE.Group();
      scene.add(stringArtGroup);

      createExtendedStringArt();
      initStardustSystem();

      // UI Events
      document.getElementById('btnFront').addEventListener('click', () => {
        isUserInteracting = false;
        setCameraPosition(0, 0, 960, 0, 0, 0);
        setActiveBtn('btnFront');
      });

      document.getElementById('btnDiagonal').addEventListener('click', () => {
        isUserInteracting = false;
        setCameraPosition(450, 200, 750, 0, 0, 0);
        setActiveBtn('btnDiagonal');
      });

      document.getElementById('btnTop').addEventListener('click', () => {
        isUserInteracting = false;
        setCameraPosition(0.01, 1250, 0.01, 0, 0, 0);
        setActiveBtn('btnTop');
      });

      const btnAuto = document.getElementById('btnAutoRotate');
      btnAuto.addEventListener('click', () => {
        autoRotate = !autoRotate;
        btnAuto.textContent = autoRotate ? '自動回転: ON' : '自動回転: OFF';
      });

      window.addEventListener('resize', onWindowResize);
    }

    function createExtendedStringArt() {
      const linePositions = [];
      const lineColors = [];

      nodesGroup = new THREE.Group();

      const pearlMaterial = new THREE.MeshStandardMaterial({
        color: 0xFFFFFF,
        roughness: 0.1,
        metalness: 0.25,
        emissive: 0x444444
      });

      const nodeGeo = new THREE.SphereGeometry(4.5, 16, 16);
      const tipNodeGeo = new THREE.SphereGeometry(6.5, 16, 16);

      const turns = 3.6;

      for (let i = 0; i <= NUM_STRINGS; i++) {
        const t = i / NUM_STRINGS;
        const angle = t * Math.PI * 2 * turns;
        const y = (t - 0.5) * HEIGHT;

        const rInner = 22 + Math.sin(t * Math.PI * 4) * 14;
        const xInner = Math.cos(angle) * rInner;
        const zInner = Math.sin(angle) * rInner;

        const wave = Math.sin(t * Math.PI * 6) * 55;
        const rOuter = (190 + wave) * Math.sin(t * Math.PI + 0.08);
        const xOuter = Math.cos(angle + 0.6) * rOuter;
        const zOuter = Math.sin(angle + 0.6) * rOuter;

        linePositions.push(xInner, y, zInner);
        linePositions.push(xOuter, y, zOuter);

        const alpha = Math.sin(t * Math.PI) * 0.85 + 0.15;
        lineColors.push(alpha, alpha, alpha);
        lineColors.push(alpha * 0.9, alpha * 0.9, alpha * 0.9);

        if (i % 8 === 0) {
          const nodeMesh = new THREE.Mesh(tipNodeGeo, pearlMaterial);
          nodeMesh.position.set(xOuter, y, zOuter);
          nodesGroup.add(nodeMesh);
        }

        if (i % 18 === 0) {
          const innerNode = new THREE.Mesh(nodeGeo, pearlMaterial);
          innerNode.position.set(xInner, y, zInner);
          nodesGroup.add(innerNode);
        }

        if (i % 24 === 0 && t > 0.15 && t < 0.85) {
          const extFactor = 1.35;
          const xExt = xOuter * extFactor;
          const zExt = zOuter * extFactor;

          linePositions.push(xOuter, y, zOuter);
          linePositions.push(xExt, y + 20, zExt);

          lineColors.push(1.0, 1.0, 1.0);
          lineColors.push(0.5, 0.5, 0.5);

          const extNode = new THREE.Mesh(nodeGeo, pearlMaterial);
          extNode.position.set(xExt, y + 20, zExt);
          nodesGroup.add(extNode);
        }
      }

      const lineGeometry = new THREE.BufferGeometry();
      lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
      lineGeometry.setAttribute('color', new THREE.Float32BufferAttribute(lineColors, 3));

      const lineMaterial = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.78,
        linewidth: 1
      });

      const linesMesh = new THREE.LineSegments(lineGeometry, lineMaterial);
      stringArtGroup.add(linesMesh);
      stringArtGroup.add(nodesGroup);
    }

    // 掴んで回すと舞い散る星屑パーティクルシステムの初期化
    function initStardustSystem() {
      stardustGeo = new THREE.BufferGeometry();
      const posArray = new Float32Array(MAX_STARDUST * 3);
      const colorArray = new Float32Array(MAX_STARDUST * 3);

      for (let i = 0; i < MAX_STARDUST; i++) {
        posArray[i * 3] = 0;
        posArray[i * 3 + 1] = -9999; // 最初は画面外に隠す
        posArray[i * 3 + 2] = 0;

        colorArray[i * 3] = 1.0;
        colorArray[i * 3 + 1] = 1.0;
        colorArray[i * 3 + 2] = 1.0;

        stardustParticles.push({
          active: false,
          life: 0,
          maxLife: 1.0,
          vx: 0, vy: 0, vz: 0
        });
      }

      stardustGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
      stardustGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

      const stardustMat = new THREE.PointsMaterial({
        size: 4.8,
        vertexColors: true,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending
      });

      stardustSystem = new THREE.Points(stardustGeo, stardustMat);
      scene.add(stardustSystem);
    }

    // 掴んで回転させた時の星屑生成エミッター
    function emitStardustParticles(count) {
      const positions = stardustGeo.attributes.position.array;
      const colors = stardustGeo.attributes.color.array;

      let emitted = 0;
      for (let i = 0; i < MAX_STARDUST; i++) {
        if (!stardustParticles[i].active) {
          stardustParticles[i].active = true;
          stardustParticles[i].life = 1.0;
          stardustParticles[i].maxLife = Math.random() * 60 + 40; // 寿命

          // 螺旋のランダムな位置から噴出
          const t = Math.random();
          const y = (t - 0.5) * HEIGHT;
          const rad = (Math.random() * 180 + 20);
          const angle = Math.random() * Math.PI * 2;

          positions[i * 3] = Math.cos(angle) * rad;
          positions[i * 3 + 1] = y + (Math.random() - 0.5) * 30;
          positions[i * 3 + 2] = Math.sin(angle) * rad;

          // ふわりと拡散する速度（速度ベクトル）
          stardustParticles[i].vx = (Math.random() - 0.5) * 2.8;
          stardustParticles[i].vy = (Math.random() - 0.2) * 2.2 + 0.5; // ゆっくり上に上昇
          stardustParticles[i].vz = (Math.random() - 0.5) * 2.8;

          // 黄金 ＆ 白ダイヤモンドのキラキラ輝くカラーリング
          const isGold = Math.random() > 0.45;
          colors[i * 3] = isGold ? 1.0 : 0.95;
          colors[i * 3 + 1] = isGold ? 0.84 : 0.95;
          colors[i * 3 + 2] = isGold ? 0.35 : 1.0;

          emitted++;
          if (emitted >= count) break;
        }
      }

      stardustGeo.attributes.position.needsUpdate = true;
      stardustGeo.attributes.color.needsUpdate = true;
    }

    function setCameraPosition(x, y, z, lx = 0, ly = 0, lz = 0) {
      targetCameraPos.set(x, y, z);
      targetLookAt.set(lx, ly, lz);
    }

    function setActiveBtn(id) {
      document.querySelectorAll('.btn-view').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // 自動回転時もほんのり星屑を漂わせる
      if (autoRotate && Math.random() > 0.4) {
        emitStardustParticles(2);
      }

      // 星屑パーティクルの移動・減衰・消滅アニメーション
      const positions = stardustGeo.attributes.position.array;
      const colors = stardustGeo.attributes.color.array;

      for (let i = 0; i < MAX_STARDUST; i++) {
        if (stardustParticles[i].active) {
          stardustParticles[i].life -= 1.0 / stardustParticles[i].maxLife;

          if (stardustParticles[i].life <= 0) {
            stardustParticles[i].active = false;
            positions[i * 3 + 1] = -9999;
          } else {
            // ふわりと広がる動き
            positions[i * 3] += stardustParticles[i].vx;
            positions[i * 3 + 1] += stardustParticles[i].vy;
            positions[i * 3 + 2] += stardustParticles[i].vz;

            // 寿命に応じて徐々に透明・輝き減衰
            const fade = stardustParticles[i].life;
            colors[i * 3] *= 0.99;
            colors[i * 3 + 1] *= 0.99;
          }
        }
      }

      stardustGeo.attributes.position.needsUpdate = true;

      // Smooth Camera & Auto Rotation
      if (!isUserInteracting) {
        camera.position.lerp(targetCameraPos, 0.05);
        controls.target.lerp(targetLookAt, 0.05);
      }

      if (autoRotate) {
        stringArtGroup.rotation.y += 0.003;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', () => {
      init();
      animate();
    });
  </script>
</body>
</html>
