<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Native Classic | Ensō Material Lab (水銀・シルバー質感探求)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+JP:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background-color: #020203;
    color: #E8E6E1;
    font-family: 'Cinzel', 'Noto Serif JP', serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
  }

  #canvas-container {
    width: 100vw;
    height: 100vh;
    position: absolute;
    top: 0; left: 0;
    cursor: grab;
  }

  #canvas-container:active {
    cursor: grabbing;
  }

  .vignette {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 25%, rgba(2,2,3,0.94) 100%);
    z-index: 2;
  }

  /* Header Branding */
  .brand-header {
    position: absolute;
    top: 28px;
    left: 36px;
    z-index: 10;
    pointer-events: none;
  }

  .brand-title {
    font-size: 15px;
    letter-spacing: 0.38em;
    color: #F0EEE9;
    text-transform: uppercase;
    font-weight: 600;
  }

  .brand-subtitle {
    font-size: 10.5px;
    letter-spacing: 0.22em;
    color: #8E8C84;
    margin-top: 5px;
    font-family: 'Noto Serif JP', serif;
  }

  /* Top Navigation Bar */
  .nav-bar-container {
    position: absolute;
    top: 28px;
    right: 36px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }

  .controls-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .btn-nav {
    background: rgba(18, 18, 20, 0.82);
    border: 1px solid rgba(220, 218, 210, 0.22);
    color: #D4D2C9;
    font-size: 11px;
    letter-spacing: 0.16em;
    padding: 8px 16px;
    border-radius: 20px;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    font-family: 'Cinzel', 'Noto Serif JP', serif;
  }

  .btn-nav:hover {
    background: rgba(232, 230, 225, 0.95);
    color: #030303;
    border-color: #E8E6E1;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(255, 255, 255, 0.15);
  }

  .btn-nav.active {
    background: rgba(232, 230, 225, 0.22);
    border-color: #F0EEE9;
    color: #FFFFFF;
    box-shadow: 0 0 14px rgba(240, 238, 233, 0.25);
  }

  /* Tuning Panel (Bottom-Left) */
  .tuning-panel {
    position: absolute;
    bottom: 34px;
    left: 36px;
    z-index: 10;
    background: rgba(14, 14, 16, 0.82);
    border: 1px solid rgba(220, 218, 210, 0.15);
    border-radius: 12px;
    padding: 16px 20px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .tuning-title {
    font-size: 11px;
    letter-spacing: 0.25em;
    color: #A6A49C;
    text-transform: uppercase;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    padding-bottom: 6px;
    font-family: 'Noto Serif JP', serif;
    display: flex;
    justify-content: space-between;
  }

  .slider-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: #CCCAC2;
    letter-spacing: 0.1em;
  }

  .slider-row label {
    font-family: 'Noto Serif JP', serif;
  }

  .slider-row input[type=range] {
    -webkit-appearance: none;
    width: 120px;
    height: 3px;
    background: rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    outline: none;
  }

  .slider-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #E8E6E1;
    cursor: pointer;
    transition: transform 0.2s;
  }

  .slider-row input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
  }

  /* Bottom Center Status Caption */
  .ui-panel {
    position: absolute;
    bottom: 34px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    text-align: center;
    pointer-events: none;
    max-width: 600px;
  }

  .ui-mode-name {
    font-size: 13.5px;
    letter-spacing: 0.32em;
    color: #F0EEE9;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .ui-mode-desc {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: #94928A;
    line-height: 1.6;
    font-family: 'Noto Serif JP', serif;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div class="vignette"></div>

  <div class="brand-header">
    <div class="brand-title">Native Classic</div>
    <div class="brand-subtitle">Ensō Material Lab — High-Contrast Silver & Chrome</div>
  </div>

  <div class="nav-bar-container">
    <!-- Camera View Guidance Row -->
    <div class="controls-row">
      <button class="btn-nav btn-view-cam active" id="btnViewFront">【 1. 正面視点 (Solo) 】</button>
      <button class="btn-nav btn-view-cam" id="btnViewSide">【 2. 側面・並列無限回廊 (Colony) 】</button>
      <button class="btn-nav btn-view-cam" id="btnViewTop">【 3. 斜め俯瞰 (Angle) 】</button>
      <button class="btn-nav" id="btnAutoRotate">自動回転: OFF</button>
    </div>
    <!-- Material Selection Row -->
    <div class="controls-row">
      <button class="btn-nav active" id="btnMatLiquidSilver">純銀リキッドシルバー</button>
      <button class="btn-nav" id="btnMatMercuryMirror">水銀・ダーククローム鏡面</button>
      <button class="btn-nav" id="btnMatPlatinum">重厚プラチナ</button>
      <button class="btn-nav" id="btnMatGlass">液体屈折ガラス (ykob)</button>
    </div>
  </div>

  <div class="tuning-panel">
    <div class="tuning-title">
      <span>金属 & スタジオ反射 調整</span>
      <span style="font-size:9px;color:#777;">MATERIAL LAB</span>
    </div>
    <div class="slider-row">
      <label>反射コントラスト (Contrast)</label>
      <input type="range" id="paramContrast" min="1.0" max="4.0" value="2.8" step="0.1">
    </div>
    <div class="slider-row">
      <label>金属粗さ (Roughness)</label>
      <input type="range" id="paramRoughness" min="0.0" max="0.3" value="0.015" step="0.005">
    </div>
    <div class="slider-row">
      <label>銀の明度 (Silver Brightness)</label>
      <input type="range" id="paramBrightness" min="0.5" max="2.5" value="1.3" step="0.05">
    </div>
    <div class="slider-row">
      <label>波立ち・うねり (Wave)</label>
      <input type="range" id="paramDistort" min="0.0" max="25.0" value="10.0" step="0.5">
    </div>
    <div class="slider-row">
      <label>並列間隔 (Spacing)</label>
      <input type="range" id="paramSpacing" min="200" max="600" value="380" step="10">
    </div>
  </div>

  <div class="ui-panel">
    <div class="ui-mode-name" id="uiTitle">Pure Liquid Silver (純銀リキッドシルバー)</div>
    <div class="ui-mode-desc" id="uiDesc">
      高コントラストなスタジオ照明と暗部の陰影により、乳白色にならず「本物の重厚な金属シルバー」として艶やかに輝きます。
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls, pmremGenerator;
    let ensoGroup;
    let ensoRings = [];
    const NUM_PARALLEL_RINGS = 13;
    let ringSpacing = 380.0;

    let matLiquidSilver, matMercuryMirror, matPlatinum, matGlass;
    let currentMaterial;
    const simplex = new SimplexNoise();

    // Parameters
    let autoRotate = false;
    let distortAmp = 10.0;
    let fluidSpeed = 0.45;
    let timeAcc = 0;
    let studioContrast = 2.8;
    let silverBrightness = 1.3;

    // Camera Guidance & Depth Transition State
    let currentViewMode = 'front';
    let isCameraTransitioning = true;
    let targetCameraPos = new THREE.Vector3(0, 0, 580);
    let targetLookAt = new THREE.Vector3(0, 0, 0);

    let depthSpread = 0.0;
    let targetDepthSpread = 0.0;

    // 1. High-Contrast Studio HDR Environment Map Generator (High dynamic range, deep blacks + brilliant key lights)
    function createHighContrastStudioEnv() {
      const size = 2048;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size / 2;
      const ctx = canvas.getContext('2d');

      // 1. Deep Black Studio Void (Essential for preventing milky white appearance)
      ctx.fillStyle = '#020204';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 2. Main Key Overhead Softbox (Crisp, pure white rectangular reflection)
      const keyBoxW = 500;
      const keyBoxH = 260;
      const keyBoxX = canvas.width * 0.70;
      const keyBoxY = canvas.height * 0.28;

      const keyGrad = ctx.createRadialGradient(keyBoxX, keyBoxY, 10, keyBoxX, keyBoxY, 320);
      keyGrad.addColorStop(0.0, 'rgba(255, 255, 255, 1.0)');
      keyGrad.addColorStop(0.35, 'rgba(245, 250, 255, 0.95)');
      keyGrad.addColorStop(0.65, 'rgba(160, 200, 240, 0.35)');
      keyGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = keyGrad;
      ctx.fillRect(keyBoxX - 400, keyBoxY - 400, 800, 800);

      // 3. Crisp Vertical Strip Softbox (Gives sharp high-contrast chrome streak along curved tube)
      const stripX = canvas.width * 0.22;
      const stripGrad = ctx.createLinearGradient(stripX - 100, 0, stripX + 100, 0);
      stripGrad.addColorStop(0.0, 'rgba(0, 0, 0, 0)');
      stripGrad.addColorStop(0.44, 'rgba(255, 255, 255, 0.98)');
      stripGrad.addColorStop(0.56, 'rgba(255, 255, 255, 0.98)');
      stripGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = stripGrad;
      ctx.fillRect(stripX - 150, 0, 300, canvas.height);

      // 4. Secondary Side Horizon Glint
      const sideX = canvas.width * 0.45;
      const sideY = canvas.height * 0.55;
      const sideGrad = ctx.createRadialGradient(sideX, sideY, 10, sideX, sideY, 280);
      sideGrad.addColorStop(0.0, 'rgba(220, 235, 255, 0.75)');
      sideGrad.addColorStop(0.5, 'rgba(120, 150, 180, 0.2)');
      sideGrad.addColorStop(1.0, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = sideGrad;
      ctx.fillRect(sideX - 300, sideY - 300, 600, 600);

      // 5. Dark Floor Shadow (Ground negative space)
      const floorGrad = ctx.createLinearGradient(0, canvas.height * 0.7, 0, canvas.height);
      floorGrad.addColorStop(0, 'rgba(0,0,0,0)');
      floorGrad.addColorStop(0.5, 'rgba(5, 5, 8, 0.85)');
      floorGrad.addColorStop(1.0, 'rgba(2, 2, 4, 1.0)');
      ctx.fillStyle = floorGrad;
      ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);

      const texture = new THREE.CanvasTexture(canvas);
      texture.mapping = THREE.EquirectangularReflectionMapping;
      return texture;
    }

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020203, 0.0003);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 6000);
      camera.position.set(0, 0, 580);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x020203, 1.0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.3;
      container.appendChild(renderer.domElement);

      pmremGenerator = new THREE.PMREMGenerator(renderer);
      pmremGenerator.compileEquirectangularShader();

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 3500;
      controls.minDistance = 80;

      controls.addEventListener('start', () => {
        isCameraTransitioning = false;
      });

      // Controlled Studio Lighting
      const ambLight = new THREE.AmbientLight(0x222228, 0.25); // Very low ambient to keep metallic deep blacks
      scene.add(ambLight);

      const keyLight = new THREE.DirectionalLight(0xFFFFFF, 2.2);
      keyLight.position.set(350, 550, 450);
      scene.add(keyLight);

      const rimLight = new THREE.DirectionalLight(0xCCE0FF, 1.8);
      rimLight.position.set(-500, -50, -350);
      scene.add(rimLight);

      const bottomKick = new THREE.PointLight(0x7788AA, 0.6, 1200);
      bottomKick.position.set(0, -380, 220);
      scene.add(bottomKick);

      // Environment Map
      const envTexture = createHighContrastStudioEnv();
      scene.environment = envTexture;

      // Define High-End Metal & Glass Materials
      // 1. Pure Liquid Silver (True metallic specular highlights & deep contrast)
      matLiquidSilver = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0xD8DCE8),
        metalness: 1.0,
        roughness: 0.015,
        envMap: envTexture,
        envMapIntensity: studioContrast
      });

      // 2. Mercury Mirror Dark Chrome (Liquid mercury with deeper shadow falloff)
      matMercuryMirror = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0xA8B0C0),
        metalness: 1.0,
        roughness: 0.005,
        envMap: envTexture,
        envMapIntensity: studioContrast * 1.25
      });

      // 3. Heavy Platinum (Weighty, rich luxury platinum silver)
      matPlatinum = new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(0xEAE6DF),
        metalness: 0.95,
        roughness: 0.04,
        reflectivity: 0.9,
        clearcoat: 1.0,
        clearcoatRoughness: 0.01,
        envMap: envTexture,
        envMapIntensity: studioContrast
      });

      // 4. ykob Refractive Glass
      matGlass = new THREE.MeshPhysicalMaterial({
        color: 0xFFFFFF,
        transmission: 0.95,
        opacity: 1.0,
        transparent: true,
        roughness: 0.0,
        metalness: 0.0,
        ior: 1.52,
        thickness: 42.0,
        attenuationColor: new THREE.Color(0xF0F4FF),
        attenuationDistance: 160.0,
        reflectivity: 0.65,
        clearcoat: 1.0,
        clearcoatRoughness: 0.0,
        envMap: envTexture,
        envMapIntensity: studioContrast * 0.8
      });

      currentMaterial = matLiquidSilver;

      // Create Parallel Rings
      ensoGroup = new THREE.Group();
      scene.add(ensoGroup);

      for (let k = 0; k < NUM_PARALLEL_RINGS; k++) {
        const geometry = new THREE.TorusGeometry(150, 44, 56, 160);
        const origPos = geometry.attributes.position.clone();
        const origNorm = geometry.attributes.normal.clone();

        const mesh = new THREE.Mesh(geometry, currentMaterial);

        const indexOffset = k - Math.floor(NUM_PARALLEL_RINGS / 2);
        mesh.userData = {
          originalPositions: origPos,
          originalNormals: origNorm,
          indexOffset: indexOffset,
          phaseShift: k * 0.4
        };

        ensoGroup.add(mesh);
        ensoRings.push(mesh);
      }

      setupEvents();
    }

    function switchMaterial(newMat, btnId, title, desc) {
      currentMaterial = newMat;
      ensoRings.forEach(ring => {
        ring.material = currentMaterial;
      });
      document.querySelectorAll('.controls-row:nth-child(2) .btn-nav').forEach(b => b.classList.remove('active'));
      document.getElementById(btnId).classList.add('active');
      document.getElementById('uiTitle').textContent = title;
      document.getElementById('uiDesc').textContent = desc;
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      isCameraTransitioning = true;
      document.querySelectorAll('.btn-view-cam').forEach(b => b.classList.remove('active'));

      if (mode === 'front') {
        document.getElementById('btnViewFront').classList.add('active');
        targetCameraPos.set(0, 0, 580);
        targetLookAt.set(0, 0, 0);
        targetDepthSpread = 0.0;
        document.getElementById('uiTitle').textContent = "Frontal Solo View (正面・単一円相)";
        document.getElementById('uiDesc').textContent = "正面では中央に美しく集約された単一の液体円相。本物の重厚な金属シルバーの輝きを鑑賞。";
      } else if (mode === 'side') {
        document.getElementById('btnViewSide').classList.add('active');
        targetCameraPos.set(820, 110, 220);
        targetLookAt.set(0, 0, 0);
        targetDepthSpread = 1.0;
        document.getElementById('uiTitle').textContent = "Side Parallel Infinite Corridor (側面・並列無限回廊)";
        document.getElementById('uiDesc').textContent = "シルバーの鏡面反射が連鎖する壮大な並列回廊。見切れながら奥深く続く液体インスタレーション。";
      } else if (mode === 'top') {
        document.getElementById('btnViewTop').classList.add('active');
        targetCameraPos.set(520, 750, 800);
        targetLookAt.set(0, 0, 0);
        targetDepthSpread = 0.9;
        document.getElementById('uiTitle').textContent = "Dynamic Perspective (斜め俯瞰・ダイナミック)";
        document.getElementById('uiDesc').textContent = "斜め上方から見下ろす立体的なパースペクティブ。金属光沢のハイライトのうねりを体感。";
      }
    }

    function setupEvents() {
      // Camera guidance buttons
      document.getElementById('btnViewFront').addEventListener('click', () => setViewMode('front'));
      document.getElementById('btnViewSide').addEventListener('click', () => setViewMode('side'));
      document.getElementById('btnViewTop').addEventListener('click', () => setViewMode('top'));

      // Material buttons
      document.getElementById('btnMatLiquidSilver').addEventListener('click', () => {
        switchMaterial(matLiquidSilver, 'btnMatLiquidSilver',
          "Pure Liquid Silver (純銀リキッドシルバー)",
          "高コントラストなスタジオ照明と暗部の陰影により、乳白色にならず「本物の重厚な金属シルバー」として艶やかに輝きます。"
        );
      });
      document.getElementById('btnMatMercuryMirror').addEventListener('click', () => {
        switchMaterial(matMercuryMirror, 'btnMatMercuryMirror',
          "Liquid Mercury Mirror (水銀・ダーククローム鏡面)",
          "シャープな環境光を鏡のように映し出す、ダークで重厚感のある液体水銀ミラー。"
        );
      });
      document.getElementById('btnMatPlatinum').addEventListener('click', () => {
        switchMaterial(matPlatinum, 'btnMatPlatinum',
          "Heavy Platinum (重厚プラチナ)",
          "クリアコートの二層光沢と温かみのある白金トーンが宿る、最高級プラチナ質感。"
        );
      });
      document.getElementById('btnMatGlass').addEventListener('click', () => {
        switchMaterial(matGlass, 'btnMatGlass',
          "Refractive Liquid Glass (液体屈折ガラス)",
          "光を滑らかに屈折させる ykob スタイルの透明ガラス表現。"
        );
      });

      // Auto-Rotate Toggle
      const btnAutoRotate = document.getElementById('btnAutoRotate');
      btnAutoRotate.addEventListener('click', () => {
        autoRotate = !autoRotate;
        btnAutoRotate.textContent = autoRotate ? "自動回転: ON" : "自動回転: OFF";
        if (autoRotate) {
          btnAutoRotate.classList.add('active');
        } else {
          btnAutoRotate.classList.remove('active');
        }
      });

      // Tuning Sliders
      document.getElementById('paramContrast').addEventListener('input', (e) => {
        studioContrast = parseFloat(e.target.value);
        matLiquidSilver.envMapIntensity = studioContrast;
        matMercuryMirror.envMapIntensity = studioContrast * 1.25;
        matPlatinum.envMapIntensity = studioContrast;
      });
      document.getElementById('paramRoughness').addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        matLiquidSilver.roughness = val;
        matMercuryMirror.roughness = val * 0.5;
        matPlatinum.roughness = val + 0.02;
      });
      document.getElementById('paramBrightness').addEventListener('input', (e) => {
        silverBrightness = parseFloat(e.target.value);
        renderer.toneMappingExposure = silverBrightness;
      });
      document.getElementById('paramDistort').addEventListener('input', (e) => {
        distortAmp = parseFloat(e.target.value);
      });
      document.getElementById('paramSpacing').addEventListener('input', (e) => {
        ringSpacing = parseFloat(e.target.value);
      });

      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (autoRotate) {
        ensoGroup.rotation.y += 0.0025;
      }

      if (isCameraTransitioning) {
        camera.position.lerp(targetCameraPos, 0.045);
        controls.target.lerp(targetLookAt, 0.045);
        if (camera.position.distanceTo(targetCameraPos) < 1.0) {
          isCameraTransitioning = false;
        }
      }

      depthSpread += (targetDepthSpread - depthSpread) * 0.045;
      timeAcc += 0.016 * fluidSpeed;

      ensoRings.forEach((mesh) => {
        const isCenter = (mesh.userData.indexOffset === 0);
        if (depthSpread < 0.02) {
          mesh.visible = isCenter;
        } else {
          mesh.visible = true;
        }

        const targetZ = mesh.userData.indexOffset * ringSpacing * depthSpread;
        mesh.position.z += (targetZ - mesh.position.z) * 0.08;

        const positions = mesh.geometry.attributes.position;
        const originals = mesh.userData.originalPositions.array;
        const normals = mesh.userData.originalNormals.array;
        const phase = mesh.userData.phaseShift;

        const count = positions.count;
        const t = timeAcc * 1.2 + phase;

        for (let i = 0; i < count; i++) {
          const i3 = i * 3;
          const ox = originals[i3];
          const oy = originals[i3 + 1];
          const oz = originals[i3 + 2];

          const nx = normals[i3];
          const ny = normals[i3 + 1];
          const nz = normals[i3 + 2];

          const theta = Math.atan2(oy, ox);

          const wave1 = Math.sin(theta * 2.0 + t) * 0.65;
          const wave2 = Math.cos(theta * 3.0 - t * 0.75) * 0.35;
          const harmonicWave = wave1 + wave2;

          const lowNoise = simplex.noise3D(ox * 0.002, oy * 0.002, t * 0.3) * 0.35;

          const disp = (harmonicWave + lowNoise) * distortAmp;
          const zTwist = Math.sin(theta * 2.0 + t * 0.9) * (distortAmp * 0.5);

          positions.setXYZ(
            i,
            ox + nx * disp,
            oy + ny * disp,
            oz + nz * disp + zTwist
          );
        }

        positions.needsUpdate = true;
        mesh.geometry.computeVertexNormals();
      });

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', () => {
      init();
      animate();
    });
  </script>
</body>
</html>
